<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente di sfondo moderno in stile azzurro/blu grest2026 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0055cc" />
    </linearGradient>
    <!-- Gradiente per la nota musicale con effetto luce -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7ff" />
    </linearGradient>
    <!-- Ombra morbida sotto la nota -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#001a4d" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Sfondo arrotondato per adattarsi a tutte le piattaforme e requisiti maskable -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Gruppo Nota Musicale -->
  <g filter="url(#shadow)" opacity="0.95">
    <!-- Teste delle note (ellissi inclinate) -->
    <ellipse cx="185" cy="350" rx="38" ry="28" transform="rotate(-20 185 350)" fill="url(#noteGrad)" />
    <ellipse cx="325" cy="310" rx="38" ry="28" transform="rotate(-20 325 310)" fill="url(#noteGrad)" />
    
    <!-- Aste della nota -->
    <rect x="208" y="160" width="15" height="190" rx="4" fill="url(#noteGrad)" />
    <rect x="348" y="120" width="15" height="190" rx="4" fill="url(#noteGrad)" />
    
    <!-- Barra di collegamento superiore inclinata -->
    <path d="M208 160 L363 120 L363 162 L208 202 Z" fill="url(#noteGrad)" />
    <!-- Seconda barra per dare un look di nota doppia ben delineata -->
    <path d="M208 210 L363 170 L363 192 L208 232 Z" fill="url(#noteGrad)" />
  </g>
</svg>
